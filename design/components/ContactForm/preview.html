<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ContactForm</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
	body { margin: 0; padding: 24px; background: var(--bg); color: var(--ink); font-family: var(--font-sans); }
</style>
</head>
<body>
<form class="vl-form" style="max-width:520px" onsubmit="event.preventDefault()">
	<div class="vl-form__row">
		<div class="vl-field"><label class="vl-label" for="n">Name</label><input class="vl-input" id="n" placeholder="Your name"></div>
		<div class="vl-field"><label class="vl-label" for="e">Email</label><input class="vl-input" id="e" type="email" placeholder="you@example.com"></div>
	</div>
	<div class="vl-field"><label class="vl-label" for="m">Message</label><textarea class="vl-input" id="m" placeholder="Tell me about your project"></textarea></div>
	<button class="vl-btn vl-btn--primary" type="submit" style="justify-content:center">Send message</button>
</form>
</body>
</html>
